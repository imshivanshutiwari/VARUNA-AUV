[workspace]
members = [
    "crates/varuna-core",
    "crates/varuna-inference",
    "crates/varuna-data",
    "crates/varuna-server",
]
resolver = "2"

[workspace.dependencies]
rustfft       = "6.2"
realfft       = "3.3"
hound         = "3.5"
ndarray       = { version = "0.15", features = ["serde"] }
nalgebra      = "0.33"
num-complex   = "0.4"
num-traits    = "0.2"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
thiserror     = "1.0"
anyhow        = "1.0"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum          = { version = "0.7", features = ["ws", "macros"] }
tokio         = { version = "1", features = ["full"] }
tower         = "0.4"
tower-http    = { version = "0.5", features = ["fs", "cors"] }
reqwest       = { version = "0.12", features = ["blocking", "json"] }
zip           = "2.1"
config        = "0.14"
webbrowser    = "0.8"
futures       = "0.3"
tract-onnx    = "0.21"
tract-core    = "0.21"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = true
